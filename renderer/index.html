<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' collabo: data: blob:; connect-src 'self'; frame-src http://127.0.0.1:*">
  <meta name="color-scheme" content="light dark">
  <title>Collabo 3D打印文件管理器</title>
  <link rel="stylesheet" href="./app.css">
</head>
<body>
  <div id="app">
    <!-- 左栏：素材库 -->
    <aside id="rail" class="pane">
      <div class="pane-head"><span>模型库</span></div>
      <div id="rail-body" class="pane-body"></div>
      <div class="pane-foot">
        <button id="btn-add" class="primary">＋ 添加目录</button>
        <button id="btn-refresh" title="刷新 (F5)">刷新</button>
      </div>
    </aside>

    <!-- 中栏：搜索 + 网格 -->
    <main id="main">
      <header id="bar">
        <div class="search">
          <span class="ico">⌕</span>
          <input id="search" type="search" placeholder="搜索文件名或路径…" autocomplete="off">
        </div>
        <label class="lbl">排序
          <select id="sort">
            <option value="mtime">修改日期</option>
            <option value="name">名称</option>
            <option value="size">大小</option>
          </select>
        </label>
        <label class="zoom" title="缩略图大小"><input id="zoom" type="range" min="120" max="320" value="190"></label>
      </header>
      <section id="grid"></section>
      <div id="empty" hidden>
        <div class="empty-ico">▣</div>
        <p class="t">暂无 3D 文件</p>
        <p class="hint">点击左侧「添加目录」开始扫描管理</p>
      </div>
      <div id="marquee" hidden></div>
      <footer id="status"><span id="count"></span><span id="progress"></span></footer>
    </main>

    <!-- 右栏：详情 -->
    <aside id="insp" class="pane"><div id="insp-body" class="pane-body"></div></aside>
  </div>

  <!-- 预览：Support Fins 编辑视口 / 基础预览 -->
  <div id="viewer" hidden>
    <div class="v-head">
      <button id="v-close">← 返回列表 (Esc)</button>
      <span id="v-title"></span>
      <span id="v-info"></span>
      <span class="spacer"></span>
      <div class="seg">
        <button id="v-mode-fins" class="on">Support Fins</button>
        <button id="v-mode-basic">基础预览</button>
      </div>
      <button id="v-reset" class="basic-only">重置视角</button>
      <label class="chk basic-only"><input id="v-wire" type="checkbox"> 线框</label>
      <button id="v-reveal">所在文件夹</button>
    </div>
    <div class="v-body">
      <iframe id="v-fins" title="Support Fins" allow="clipboard-write"></iframe>
      <canvas id="v-canvas" hidden></canvas>
      <div id="v-msg"></div>
    </div>
  </div>

  <!-- 批量改名 -->
  <div id="rename" class="modal" hidden>
    <div class="dlg">
      <div class="dlg-head">批量改名 <span id="rn-count"></span></div>
      <div class="dlg-body">
        <label>主名称（留空保留原名）<input id="rn-base" type="text" placeholder="例如：零件"></label>
        <div class="row">
          <label>序号起始<input id="rn-start" type="number" value="1" min="0"></label>
          <label>序号位数<input id="rn-pad" type="number" value="2" min="1" max="6"></label>
          <label>分隔符<input id="rn-sep" type="text" value="_" maxlength="3"></label>
        </div>
        <div class="row">
          <label>前缀<input id="rn-prefix" type="text"></label>
          <label>后缀<input id="rn-suffix" type="text"></label>
        </div>
        <div class="row">
          <label>查找<input id="rn-find" type="text"></label>
          <label>替换为<input id="rn-repl" type="text"></label>
        </div>
        <label class="chk"><input id="rn-seq" type="checkbox" checked> 添加序号（多选时）</label>
        <div id="rn-preview"></div>
      </div>
      <div class="dlg-foot">
        <span id="rn-err"></span><span class="spacer"></span>
        <button id="rn-cancel">取消</button>
        <button id="rn-ok" class="primary">确定改名</button>
      </div>
    </div>
  </div>

  <div id="ctx" hidden></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
